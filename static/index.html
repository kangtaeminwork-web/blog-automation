<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>My Blog API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
    header { background: #4f46e5; color: white; padding: 16px 32px; font-size: 20px; font-weight: bold; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 16px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-bottom: 16px; font-size: 18px; color: #4f46e5; }
    input, textarea { width: 100%; padding: 10px 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { background: #4338ca; }
    .msg { margin-top: 10px; font-size: 13px; color: #16a34a; }
    .err { color: #dc2626; }
    .post-item { border-bottom: 1px solid #eee; padding: 12px 0; }
    .post-item:last-child { border-bottom: none; }
    .post-title { font-weight: bold; margin-bottom: 4px; }
    .post-content { font-size: 13px; color: #666; margin-bottom: 8px; }
    .post-actions { display: flex; gap: 8px; }
    .btn-edit { background: #f59e0b; font-size: 12px; padding: 6px 12px; }
    .btn-edit:hover { background: #d97706; }
    .btn-delete { background: #dc2626; font-size: 12px; padding: 6px 12px; }
    .btn-delete:hover { background: #b91c1c; }
    .btn-save { background: #16a34a; font-size: 12px; padding: 6px 12px; }
    .btn-save:hover { background: #15803d; }
    .btn-cancel { background: #6b7280; font-size: 12px; padding: 6px 12px; }
    .btn-cancel:hover { background: #4b5563; }
    .edit-box input, .edit-box textarea { margin-bottom: 8px; }
    #auth-status { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
    .hidden { display: none; }
    .tab-btns { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { background: #e0e7ff; color: #4f46e5; }
    .tab-btn.active { background: #4f46e5; color: white; }
    .comment-section { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #eee; }
    .comment-item { font-size: 13px; color: #555; padding: 6px 0; display: flex; justify-content: space-between; align-items: center; }
    .comment-text { flex: 1; }
    .btn-comment-delete { background: #dc2626; font-size: 11px; padding: 4px 8px; margin-left: 8px; }
    .btn-comment-delete:hover { background: #b91c1c; }
    .comment-input-wrap { display: flex; gap: 8px; margin-top: 8px; }
    .comment-input-wrap input { margin-bottom: 0; flex: 1; }
    .btn-comment-submit { font-size: 12px; padding: 10px 14px; white-space: nowrap; }
  </style>
</head>
<body>
  <header>📝 My Blog</header>
  <div class="container">

    <div class="tab-btns">
      <button class="tab-btn active" onclick="showTab('login')">로그인</button>
      <button class="tab-btn" onclick="showTab('register')">회원가입</button>
      <button class="tab-btn" onclick="showTab('posts')">포스트 목록</button>
      <button class="tab-btn" id="write-tab-btn" onclick="showTab('write')">글 쓰기</button>
    </div>

    <div class="card" id="tab-login">
      <h2>🔐 로그인</h2>
      <div id="auth-status">로그인 안 됨</div>
      <input id="login-user" placeholder="아이디" />
      <input id="login-pass" placeholder="비밀번호" type="password" />
      <button onclick="login()">로그인</button>
      <button style="background:#dc2626;margin-left:8px" onclick="logout()">로그아웃</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <div class="card hidden" id="tab-register">
      <h2>✏️ 회원가입</h2>
      <input id="reg-user" placeholder="아이디" />
      <input id="reg-pass" placeholder="비밀번호" type="password" />
      <input id="reg-email" placeholder="이메일" />
      <button onclick="register()">가입하기</button>
      <div class="msg" id="register-msg"></div>
    </div>

    <div class="card hidden" id="tab-posts">
      <h2>📋 포스트 목록</h2>
      <button onclick="loadPosts()">새로고침</button>
      <div id="post-list" style="margin-top:16px"></div>
    </div>

    <div class="card hidden" id="tab-write">
      <h2>🖊️ 새 포스트 작성</h2>
      <input id="post-title" placeholder="제목" />
      <textarea id="post-content" placeholder="내용"></textarea>
      <button onclick="createPost()">게시하기</button>
      <div class="msg" id="write-msg"></div>
    </div>

  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    let token = localStorage.getItem("token") || null;
    let myUserId = null;

    function showTab(name) {
      ["login","register","posts","write"].forEach(t => {
        document.getElementById("tab-"+t).classList.add("hidden");
      });
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-"+name).classList.remove("hidden");
      const tabs = ["login","register","posts","write"];
      document.querySelectorAll(".tab-btn")[tabs.indexOf(name)].classList.add("active");
      if (name === "posts") loadPosts();
      updateAuthStatus();
    }

    function updateAuthStatus() {
      const el = document.getElementById("auth-status");
      const user = localStorage.getItem("username");
      el.textContent = token ? `✅ 로그인됨: ${user}` : "❌ 로그인 안 됨";
    }

    async function register() {
      const u = document.getElementById("reg-user").value;
      const p = document.getElementById("reg-pass").value;
      const e = document.getElementById("reg-email").value;
      const msg = document.getElementById("register-msg");
      const res = await fetch(`${API}/register?username=${u}&password=${p}&email=${e}`, { method: "POST" });
      const data = await res.json();
      msg.className = res.ok ? "msg" : "msg err";
      msg.textContent = res.ok ? "회원가입 완료! 로그인하세요." : (data.detail || "오류 발생");
    }

    async function login() {
      const u = document.getElementById("login-user").value;
      const p = document.getElementById("login-pass").value;
      const msg = document.getElementById("login-msg");
      const body = new URLSearchParams({ username: u, password: p });
      const res = await fetch(`${API}/token`, { method: "POST", body });
      const data = await res.json();
      if (res.ok) {
        token = data.access_token;
        localStorage.setItem("token", token);
        localStorage.setItem("username", u);
        msg.className = "msg";
        msg.textContent = "로그인 성공!";
        updateAuthStatus();
        await fetchMyUserId();
      } else {
        msg.className = "msg err";
        msg.textContent = data.detail || "로그인 실패";
      }
    }

    async function fetchMyUserId() {
      if (!token) return;
      const res = await fetch(`${API}/me`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        const me = await res.json();
        myUserId = me.id;
      }
    }

    function logout() {
      token = null;
      myUserId = null;
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      document.getElementById("login-msg").textContent = "로그아웃 됐습니다.";
      updateAuthStatus();
    }

    async function loadPosts() {
      const res = await fetch(`${API}/posts`);
      const posts = await res.json();
      const el = document.getElementById("post-list");
      if (posts.length === 0) { el.textContent = "포스트가 없습니다."; return; }

      if (token && !myUserId) await fetchMyUserId();

      el.innerHTML = posts.map(p => {
        const actionBtns = token ? `
          <div class="post-actions">
            <button class="btn-edit" data-id="${p.id}">✏️ 수정</button>
            <button class="btn-delete" data-id="${p.id}">🗑️ 삭제</button>
          </div>` : "";

        const commentInput = token ? `
          <div class="comment-input-wrap">
            <input id="comment-input-${p.id}" placeholder="댓글을 입력하세요" />
            <button class="btn-comment-submit" data-post-id="${p.id}">댓글 작성</button>
          </div>` : "";

        return `
          <div class="post-item" id="post-${p.id}">
            <div class="post-title" id="title-${p.id}">${p.title}</div>
            <div class="post-content" id="content-${p.id}">${p.content}</div>
            ${actionBtns}
            <div class="comment-section">
              <div id="comment-list-${p.id}"></div>
              ${commentInput}
            </div>
          </div>`;
      }).join("");

      window._postsData = {};
      posts.forEach(p => { window._postsData[p.id] = p; });

      document.querySelectorAll(".btn-edit").forEach(btn => {
        btn.addEventListener("click", () => {
          const p = window._postsData[btn.dataset.id];
          startEdit(p.id, p.title, p.content);
        });
      });

      document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", () => deletePost(btn.dataset.id));
      });

      document.querySelectorAll(".btn-comment-submit").forEach(btn => {
        btn.addEventListener("click", () => createComment(btn.dataset.postId));
      });

      posts.forEach(p => loadComments(p.id));
    }

    async function loadComments(postId) {
      const res = await fetch(`${API}/posts/${postId}/comments`);
      const comments = await res.json();
      const el = document.getElementById(`comment-list-${postId}`);
      if (!el) return;
      if (comments.length === 0) {
        el.innerHTML = "<div style='font-size:12px;color:#aaa'>댓글이 없습니다.</div>";
        return;
      }
      el.innerHTML = comments.map(c => {
        const canDelete = token && myUserId && c.author_id === myUserId;
        const deleteBtn = canDelete ? `<button class="btn-comment-delete" data-post-id="${postId}" data-comment-id="${c.id}">삭제</button>` : "";
        return `<div class="comment-item"><span class="comment-text">💬 ${c.content}</span>${deleteBtn}</div>`;
      }).join("");

      el.querySelectorAll(".btn-comment-delete").forEach(btn => {
        btn.addEventListener("click", () => deleteComment(btn.dataset.postId, btn.dataset.commentId));
      });
    }

    async function createComment(postId) {
      if (!token) { alert("먼저 로그인하세요!"); return; }
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value;
      if (!content) { alert("댓글 내용을 입력하세요!"); return; }
      const res = await fetch(`${API}/posts/${postId}/comments`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ content })
      });
      if (res.ok) {
        input.value = "";
        loadComments(postId);
      } else {
        const data = await res.json();
        alert(data.detail || "댓글 작성 실패");
      }
    }

    async function deleteComment(postId, commentId) {
      if (!confirm("댓글을 삭제할까요?")) return;
      const res = await fetch(`${API}/posts/${postId}/comments/${commentId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        loadComments(postId);
      } else {
        const data = await res.json();
        alert(data.detail || "삭제 실패");
      }
    }

    function startEdit(id, title, content) {
      const item = document.getElementById(`post-${id}`);

      const titleInput = document.createElement("input");
      titleInput.id = `edit-title-${id}`;
      titleInput.value = title;

      const contentArea = document.createElement("textarea");
      contentArea.id = `edit-content-${id}`;
      contentArea.textContent = content;

      const saveBtn = document.createElement("button");
      saveBtn.className = "btn-save";
      saveBtn.textContent = "💾 저장";
      saveBtn.addEventListener("click", () => savePost(id));

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "btn-cancel";
      cancelBtn.textContent = "취소";
      cancelBtn.addEventListener("click", loadPosts);

      const actions = document.createElement("div");
      actions.className = "post-actions";
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);

      const box = document.createElement("div");
      box.className = "edit-box";
      box.appendChild(titleInput);
      box.appendChild(contentArea);
      box.appendChild(actions);

      item.innerHTML = "";
      item.appendChild(box);
    }

    async function savePost(id) {
      const title = document.getElementById(`edit-title-${id}`).value;
      const content = document.getElementById(`edit-content-${id}`).value;
      const res = await fetch(`${API}/posts/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ title, content })
      });
      if (res.ok) {
        loadPosts();
      } else {
        const data = await res.json();
        alert(data.detail || "수정 실패");
      }
    }

    async function deletePost(id) {
      if (!confirm("정말 삭제할까요?")) return;
      const res = await fetch(`${API}/posts/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        loadPosts();
      } else {
        const data = await res.json();
        alert(data.detail || "삭제 실패");
      }
    }

    async function createPost() {
      if (!token) { alert("먼저 로그인하세요!"); return; }
      const title = document.getElementById("post-title").value;
      const content = document.getElementById("post-content").value;
      const msg = document.getElementById("write-msg");
      const res = await fetch(`${API}/posts`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ title, content })
      });
      const data = await res.json();
      msg.className = res.ok ? "msg" : "msg err";
      msg.textContent = res.ok ? "포스트 작성 완료!" : (data.detail || "오류 발생");
    }

    updateAuthStatus();
  </script>
</body>
</html>
